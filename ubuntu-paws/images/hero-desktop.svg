<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroDesktopTitle">
  <title id="heroDesktopTitle">Illustration of a rescued dog and cat sitting together</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1f5ee"/>
      <stop offset="100%" stop-color="#fbfaf7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b5443" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="24" fill="url(#skyGrad)"/>

  <!-- decorative arch -->
  <circle cx="450" cy="470" r="330" fill="#0f6e56" opacity="0.08"/>
  <circle cx="450" cy="470" r="250" fill="#d85a30" opacity="0.06"/>

  <!-- ground -->
  <ellipse cx="450" cy="470" rx="380" ry="40" fill="#0f6e56" opacity="0.10"/>

  <!-- scattered paw prints, each a different palette colour -->
  <g opacity="0.28">
    <g fill="#0f6e56" transform="translate(120,140) rotate(-15)">
      <ellipse cx="0" cy="0" rx="10" ry="13"/>
      <ellipse cx="-14" cy="-16" rx="5" ry="6"/>
      <ellipse cx="0" cy="-20" rx="5" ry="6"/>
      <ellipse cx="14" cy="-16" rx="5" ry="6"/>
    </g>
    <g fill="#d1980b" transform="translate(760,110) rotate(20)">
      <ellipse cx="0" cy="0" rx="8" ry="10"/>
      <ellipse cx="-11" cy="-13" rx="4" ry="5"/>
      <ellipse cx="0" cy="-16" rx="4" ry="5"/>
      <ellipse cx="11" cy="-13" rx="4" ry="5"/>
    </g>
    <g fill="#3a6ea8" transform="translate(800,300) rotate(-10)">
      <ellipse cx="0" cy="0" rx="9" ry="11"/>
      <ellipse cx="-12" cy="-14" rx="4.5" ry="5.5"/>
      <ellipse cx="0" cy="-18" rx="4.5" ry="5.5"/>
      <ellipse cx="12" cy="-14" rx="4.5" ry="5.5"/>
    </g>
  </g>

  <!-- heart -->
  <path d="M450 150 C440 132 410 132 410 158 C410 178 450 200 450 200 C450 200 490 178 490 158 C490 132 460 132 450 150 Z" fill="#d85a30" opacity="0.85"/>

  <!-- DOG (left) -->
  <g filter="url(#softShadow)">
    <ellipse cx="290" cy="410" rx="95" ry="80" fill="#d85a30"/>
    <ellipse cx="205" cy="440" rx="24" ry="34" fill="#d85a30"/>
    <ellipse cx="375" cy="440" rx="24" ry="34" fill="#d85a30"/>
    <path d="M300 420 Q 380 380 370 320 Q 400 340 380 400 Q 350 430 300 420 Z" fill="#d85a30"/>
    <circle cx="270" cy="300" r="78" fill="#e8734a"/>
    <ellipse cx="205" cy="255" rx="26" ry="46" fill="#b6461f" transform="rotate(-18 205 255)"/>
    <ellipse cx="335" cy="255" rx="26" ry="46" fill="#b6461f" transform="rotate(18 335 255)"/>
    <ellipse cx="270" cy="325" rx="38" ry="26" fill="#fff8f0"/>
    <circle cx="270" cy="315" r="11" fill="#2c2c2a"/>
    <circle cx="246" cy="282" r="8" fill="#2c2c2a"/>
    <circle cx="294" cy="282" r="8" fill="#2c2c2a"/>
    <circle cx="248" cy="279" r="2.5" fill="#fff"/>
    <circle cx="296" cy="279" r="2.5" fill="#fff"/>
    <path d="M258 335 Q270 342 282 335" stroke="#2c2c2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- blue collar with a gold tag, adding a second and third palette colour -->
    <path d="M228 358 Q270 378 312 358" stroke="#3a6ea8" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="270" cy="374" r="7" fill="#d1980b"/>
  </g>


  <!-- CAT (right) -->
  <g filter="url(#softShadow)">
    <ellipse cx="610" cy="415" rx="85" ry="72" fill="#0f6e56"/>
    <ellipse cx="540" cy="445" rx="20" ry="30" fill="#0f6e56"/>
    <ellipse cx="680" cy="445" rx="20" ry="30" fill="#0f6e56"/>
    <path d="M660 430 Q 740 420 745 340 Q 765 380 730 440 Q 690 450 660 430 Z" fill="#0f6e56"/>
    <circle cx="600" cy="310" r="70" fill="#14876a"/>
    <path d="M545 265 L530 205 L580 245 Z" fill="#14876a"/>
    <path d="M655 265 L672 203 L622 245 Z" fill="#14876a"/>
    <path d="M549 260 L538 220 L572 248 Z" fill="#0b5443"/>
    <path d="M651 260 L664 218 L628 248 Z" fill="#0b5443"/>
    <ellipse cx="600" cy="335" rx="34" ry="22" fill="#f2fbf8"/>
    <path d="M600 322 L592 332 L608 332 Z" fill="#e8734a"/>
    <circle cx="578" cy="298" r="7" fill="#2c2c2a"/>
    <circle cx="622" cy="298" r="7" fill="#2c2c2a"/>
    <circle cx="580" cy="295" r="2" fill="#fff"/>
    <circle cx="624" cy="295" r="2" fill="#fff"/>
    <g stroke="#0b5443" stroke-width="2" stroke-linecap="round">
      <line x1="565" y1="330" x2="530" y2="322"/>
      <line x1="565" y1="337" x2="530" y2="337"/>
      <line x1="635" y1="330" x2="670" y2="322"/>
      <line x1="635" y1="337" x2="670" y2="337"/>
    </g>
    <!-- gold bow tie -->
    <path d="M600 352 L578 340 L578 364 Z" fill="#d1980b"/>
    <path d="M600 352 L622 340 L622 364 Z" fill="#d1980b"/>
    <circle cx="600" cy="352" r="6" fill="#a3760a"/>
  </g>
</svg>
