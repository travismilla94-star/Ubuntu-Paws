<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroMobileTitle">
  <title id="heroMobileTitle">Illustration of a rescued dog and cat sitting together</title>
  <defs>
    <linearGradient id="skyGradM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1f5ee"/>
      <stop offset="100%" stop-color="#fbfaf7"/>
    </linearGradient>
    <filter id="softShadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b5443" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="460" rx="24" fill="url(#skyGradM)"/>
  <circle cx="300" cy="420" r="230" fill="#0f6e56" opacity="0.08"/>
  <ellipse cx="300" cy="410" rx="240" ry="34" fill="#0f6e56" opacity="0.10"/>

  <path d="M300 110 C290 92 260 92 260 118 C260 138 300 160 300 160 C300 160 340 138 340 118 C340 92 310 92 300 110 Z" fill="#d85a30" opacity="0.85"/>

  <g opacity="0.2">
    <g fill="#0f6e56" transform="translate(90,150) rotate(-15)">
      <ellipse cx="0" cy="0" rx="9" ry="11"/>
      <ellipse cx="-12" cy="-14" rx="4.5" ry="5.5"/>
      <ellipse cx="0" cy="-18" rx="4.5" ry="5.5"/>
      <ellipse cx="12" cy="-14" rx="4.5" ry="5.5"/>
    </g>
    <g fill="#d1980b" transform="translate(500,180) rotate(20)">
      <ellipse cx="0" cy="0" rx="9" ry="11"/>
      <ellipse cx="-12" cy="-14" rx="4.5" ry="5.5"/>
      <ellipse cx="0" cy="-18" rx="4.5" ry="5.5"/>
      <ellipse cx="12" cy="-14" rx="4.5" ry="5.5"/>
    </g>
  </g>

  <!-- DOG (left, smaller) -->
  <g filter="url(#softShadowM)">
    <ellipse cx="215" cy="360" rx="80" ry="66" fill="#d85a30"/>
    <ellipse cx="145" cy="385" rx="20" ry="28" fill="#d85a30"/>
    <ellipse cx="285" cy="385" rx="20" ry="28" fill="#d85a30"/>
    <circle cx="200" cy="265" r="64" fill="#e8734a"/>
    <ellipse cx="145" cy="225" rx="21" ry="38" fill="#b6461f" transform="rotate(-18 145 225)"/>
    <ellipse cx="255" cy="225" rx="21" ry="38" fill="#b6461f" transform="rotate(18 255 225)"/>
    <ellipse cx="200" cy="285" rx="31" ry="21" fill="#fff8f0"/>
    <circle cx="200" cy="277" r="9" fill="#2c2c2a"/>
    <circle cx="180" cy="250" r="6.5" fill="#2c2c2a"/>
    <circle cx="220" cy="250" r="6.5" fill="#2c2c2a"/>
    <circle cx="182" cy="247" r="2" fill="#fff"/>
    <circle cx="222" cy="247" r="2" fill="#fff"/>
    <!-- blue collar with a gold tag -->
    <path d="M167 322 Q200 338 233 322" stroke="#3a6ea8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="334" r="5.5" fill="#d1980b"/>
  </g>

  <!-- CAT (right, smaller) -->
  <g filter="url(#softShadowM)">
    <ellipse cx="410" cy="365" rx="70" ry="58" fill="#0f6e56"/>
    <ellipse cx="352" cy="388" rx="16" ry="24" fill="#0f6e56"/>
    <ellipse cx="468" cy="388" rx="16" ry="24" fill="#0f6e56"/>
    <path d="M452 375 Q515 366 519 300 Q535 334 507 385 Q474 393 452 375 Z" fill="#0f6e56"/>
    <circle cx="405" cy="275" r="56" fill="#14876a"/>
    <path d="M360 238 L348 188 L390 222 Z" fill="#14876a"/>
    <path d="M450 238 L465 186 L423 222 Z" fill="#14876a"/>
    <path d="M363 234 L354 200 L382 224 Z" fill="#0b5443"/>
    <path d="M447 234 L458 198 L428 224 Z" fill="#0b5443"/>
    <ellipse cx="405" cy="296" rx="27" ry="18" fill="#f2fbf8"/>
    <path d="M405 286 L398 294 L412 294 Z" fill="#e8734a"/>
    <circle cx="386" cy="266" r="6" fill="#2c2c2a"/>
    <circle cx="424" cy="266" r="6" fill="#2c2c2a"/>
    <circle cx="388" cy="263" r="1.8" fill="#fff"/>
    <circle cx="426" cy="263" r="1.8" fill="#fff"/>
    <!-- gold bow tie -->
    <path d="M405 318 L388 308 L388 328 Z" fill="#d1980b"/>
    <path d="M405 318 L422 308 L422 328 Z" fill="#d1980b"/>
    <circle cx="405" cy="318" r="5" fill="#a3760a"/>
  </g>
